name: CI/CD Deploy

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v3

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v2
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_KEY }}
        aws-region: ap-south-2

    - name: Login to ECR
      uses: aws-actions/amazon-ecr-login@v1

    - name: Build & Push Docker Image
      run: |
        docker buildx create --use
        docker buildx build \
          --platform linux/amd64,linux/arm64 \
          -t 928747699677.dkr.ecr.ap-south-2.amazonaws.com/mlops-app:latest \
          --push .

    - name: Deploy to EC2 via SSH
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USER }}
        key: ${{ secrets.EC2_SSH_KEY }}
        script: |
          aws ecr get-login-password --region ap-south-2 | docker login --username AWS --password-stdin 928747699677.dkr.ecr.ap-south-2.amazonaws.com

          docker pull 928747699677.dkr.ecr.ap-south-2.amazonaws.com/mlops-app:latest

          docker stop mlops-container || true
          docker rm mlops-container || true

          docker run -d -p 80:8000 --restart always --name mlops-container \
          928747699677.dkr.ecr.ap-south-2.amazonaws.com/mlops-app:latest

          docker image prune -af